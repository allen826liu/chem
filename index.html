<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#125b63">
  <meta name="description" content="在空白元素周期表上默写符号和名称。自选默写数量、随机抽题、自动批改与错题重练。">
  <title>Elements</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23125b63'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='39' font-weight='bold' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=compact-20261011">
  <script type="module" src="./app.js?v=compact-20261011"></script>
  <script type="module" src="./analytics.js?v=compact-20261011"></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Elements 首页">Elements</a>
      <button class="quiet" id="wrong-bank">错题 <span id="wrong-count">0</span></button>
    </header>
    <main>
      <section class="settings" aria-label="设置默写范围">
        <div class="setting-group mode-group"><span class="setting-label">方式</span><div class="segmented" role="group" aria-label="默写方式"><button data-mode="first" aria-pressed="true" class="active">顺序</button><button data-mode="random" aria-pressed="false">随机</button><button data-mode="manual" aria-pressed="false">自选</button></div></div>
        <div class="setting-group count-group"><label class="setting-label" for="count">数量</label><div class="count-control"><button id="minus" aria-label="减少默写数量">−</button><input id="count" type="number" min="1" max="118" value="20" aria-describedby="count-limit"><button id="plus" aria-label="增加默写数量">＋</button></div><small id="count-limit">1–118</small></div>
        <div class="setting-group pool-group"><label class="setting-label" for="pool">范围</label><select id="pool"><option value="monthly">月考范围（54 个）</option><option value="20">前 20 个</option><option value="36">前 36 个</option><option value="54">前 54 个</option><option value="86">前 86 个</option><option value="118" selected>全部 118 个</option></select><small id="pool-note" hidden>1–38、49–56、81–88 号</small></div>
        <div class="setting-group language-group"><label class="setting-label" for="language">名称</label><select id="language"><option value="zh">中文</option><option value="en">英文</option></select></div>
        <button class="primary start-button" id="start">开始</button>
      </section>
      <div class="selection-note" id="selection-note" hidden><span id="selection-text">已选 0 个</span><div><button class="quiet" id="select-all">全选</button><button class="quiet" id="clear-selection">清空</button></div></div>
      <section id="results" class="results" aria-live="polite" hidden></section>
      <section class="worksheet" aria-labelledby="table-heading">
        <div class="worksheet-head"><h2 id="table-heading">周期表</h2><div class="progress-wrap"><span id="progress-label">0 / 20</span><div class="progress-track" aria-hidden="true"><i id="progress-fill"></i></div></div></div>
        <div class="table-scroll" role="region" aria-label="元素周期表，可左右滚动" tabindex="0"><div class="periodic-table" id="periodic-table"></div></div>
        <div class="worksheet-bottom"><div class="legend"><span><i class="metal"></i>主族金属</span><span><i class="main"></i>其他主族</span><span><i class="transition"></i>过渡金属</span><span><i class="halogen"></i>卤素</span><span><i class="noble"></i>稀有气体</span><span><i class="inner"></i>镧系 / 锕系</span></div></div>
      </section>
      <section id="mistake-details" class="mistake-details" hidden aria-labelledby="mistake-title"><h2 id="mistake-title">错项</h2><div id="mistake-list"></div></section>
      <div class="action-bar"><div class="actions"><button class="secondary" id="reference">答案</button><button class="primary" id="submit">批改</button></div></div>
    </main>
    <footer>
      <div class="visit-stats" aria-label="网站访问统计" aria-live="polite">
        <span title="从2026年10月11日起，按访问标识估算并尽量去重">访客（估算） <strong id="visitor-count">…</strong></span>
        <span>访问 <strong id="visit-count">…</strong></span>
        <span id="visit-status" class="visit-status" role="status"></span>
        <a href="https://busuanzi.9420.ltd/" target="_blank" rel="noreferrer" title="不蒜子统计；不上传默写答案">统计</a>
      </div>
      <div class="footer-meta"><span id="save-status">本地保存</span><div><a href="https://www.chemsoc.org.cn/news/international/a2613.html" target="_blank" rel="noreferrer">中国化学会</a><a href="https://iupac.org/what-we-do/periodic-table-of-elements/" target="_blank" rel="noreferrer">IUPAC</a></div></div>
    </footer>
  </div>
  <dialog id="reference-dialog" aria-labelledby="reference-heading"><div class="dialog-top"><div><h2 id="reference-heading">答案</h2><p>打开答案会自动批改。</p></div><button id="close-reference" class="quiet" aria-label="关闭答案表">关闭</button></div><div id="reference-content" class="reference-grid"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
